spring.application.name=agroeasy-backend
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/agroeasy
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username={your_h2_username}
spring.datasource.password={your_h2_password}
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------------------------------------------------------------
# To use MySQL instead, comment the H2 block above and uncomment this:
# spring.datasource.url=jdbc:mysql://localhost:3306/agroeasy?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ---------------------------------------------------------------

# JWT
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_BEFORE_DEPLOYING_1234567890
app.jwt.expiration-ms=86400000

# ---------------------------------------------------------------
# External API keys - fill these in
# ---------------------------------------------------------------
# data.gov.in - free key from https://data.gov.in/user (Profile -> Generate API Key)
app.datagovin.api-key={YOUR_API_KEY}
app.datagovin.price-resource=9ef84268-d588-465a-a308-a864a43d0070

# OpenWeatherMap - free key from https://openweathermap.org/api
app.openweather.api-key={your_openweather_api_key}

# Google Gemini - get a key from https://aistudio.google.com/apikey
# Required for AI disease detection and the grow/pesticide guide.
app.gemini.api-key={your_gemini_api_key}"
# Model IDs move fast - check https://ai.google.dev/gemini-api/docs/models
# for the current Flash model name if this starts returning 404s.
app.gemini.model=gemini-3.6-flash

# CORS - the frontend origin allowed to call this API
app.cors.allowed-origin=http://localhost:5173
